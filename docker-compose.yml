services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartattend}
      POSTGRES_USER: ${POSTGRES_USER:-smartattend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartattend} -d ${POSTGRES_DB:-smartattend}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
